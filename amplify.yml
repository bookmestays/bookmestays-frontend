version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify only exposes console env vars at build time; copy the server-side ones
        # into .env.production so the Next.js server (rewrites, proxy.ts) can read them at runtime.
        - env | grep -E '^(BACKEND_URL|ADMIN_HOST|PARTNER_HOST|NEXT_PUBLIC_[A-Z_]+)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
